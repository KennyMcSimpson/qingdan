name: Bug report / 问题反馈
description: Report a reproducible problem / 反馈可复现的问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App version / 应用版本
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and scaling / Windows 版本与显示缩放
      placeholder: "Windows 11, 150%, dual monitors / 双显示器"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望表现
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs / 截图或日志
      description: Remove personal tasks and private paths. / 请去除私人待办与路径。

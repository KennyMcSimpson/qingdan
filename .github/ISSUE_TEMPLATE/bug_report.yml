name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and display scaling
      placeholder: "Windows 11, 150%, dual monitors"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal tasks and private paths.
